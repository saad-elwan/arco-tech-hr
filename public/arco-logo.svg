<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="blueWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="greenWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
  </defs>

  <g transform="translate(40, 40)">
    <!-- Arch Icon Group -->
    <g filter="url(#subtleGlow)">
      <!-- Left Curve Solid -->
      <path d="M 60 220 C 50 160, 90 90, 160 50 C 130 90, 105 150, 95 220 Z" fill="url(#blueWave)" />
      
      <!-- Middle Arch Segment 1 -->
      <path d="M 95 220 C 115 140, 180 60, 270 30 C 230 65, 175 135, 140 220 Z" fill="url(#blueWave)" />
      
      <!-- Top Sweeping Green Ribbons -->
      <path d="M 125 150 C 180 80, 260 40, 350 20 C 290 45, 215 90, 165 170 Z" fill="url(#greenWave)" />
      <path d="M 170 120 C 225 65, 305 30, 390 10 C 330 35, 255 75, 205 145 Z" fill="url(#greenWave)" />

      <!-- Right Leg of A -->
      <path d="M 230 220 C 255 170, 290 120, 340 70 C 305 125, 270 175, 255 220 Z" fill="url(#blueWave)" />
    </g>

    <!-- Typography -->
    <!-- Arco -->
    <text x="400" y="145" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="96" fill="#0f2b48" letter-spacing="-1">
      Arco <tspan fill="#0284c7">Tech</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="405" y="215" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="40" fill="#64748b" letter-spacing="0.5">
      For Management Sys
    </text>
  </g>
</svg>
