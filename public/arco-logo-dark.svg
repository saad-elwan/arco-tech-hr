<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" width="100%" height="100%">
  <defs>
    <linearGradient id="blueRibbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="greenRibbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="darkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(30, 25)">
    <!-- Iconic Arch Waves -->
    <g filter="url(#darkGlow)">
      <!-- Left Outer Arch Curve -->
      <path d="M 50 250 C 40 170, 95 85, 185 40 C 150 90, 115 160, 95 250 Z" fill="url(#blueRibbonDark)" />
      
      <!-- Inner Arch Blue Swoosh -->
      <path d="M 95 250 C 120 150, 205 60, 310 25 C 260 70, 195 150, 150 250 Z" fill="url(#blueRibbonDark)" />
      
      <!-- Upper Green Ribbons -->
      <path d="M 130 160 C 190 85, 290 35, 410 15 C 330 45, 235 100, 175 190 Z" fill="url(#greenRibbonDark)" />
      <path d="M 180 130 C 245 65, 345 25, 460 5 C 385 35, 285 80, 225 160 Z" fill="url(#greenRibbonDark)" />

      <!-- Right Blue Leg -->
      <path d="M 260 250 C 295 180, 345 120, 415 60 C 370 125, 325 185, 295 250 Z" fill="url(#blueRibbonDark)" />
    </g>

    <!-- Typography for Dark Backgrounds -->
    <text x="490" y="165" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="112" fill="#ffffff" letter-spacing="-1.5">
      Arco
    </text>

    <text x="745" y="165" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="112" fill="#38bdf8" letter-spacing="-1.5">
      Tech
    </text>

    <text x="495" y="245" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="46" fill="#94a3b8" letter-spacing="0.5">
      For Management Sys
    </text>
  </g>
</svg>
